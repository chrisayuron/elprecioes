<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>El precio es…</title><link rel="stylesheet" href="src/styles.css"></head><body><main class="shell"><header class="hero"><h1>El precio es…</h1><p>¿Qué tan cerca estás del precio real?</p><p id="status" class="status">Conectando…</p></header><section id="home" class="panel"><h2>Ingresar</h2><div class="tabs"><button id="playerTab" class="secondary">Participante</button><button id="adminTab" class="secondary">Administrador</button></div><div id="playerEntry"><label>Nombre</label><input id="playerName" maxlength="40" placeholder="Tu nombre"><label>Código de partida</label><input id="sessionCode" maxlength="8" placeholder="Código"><button id="joinBtn">Ingresar a la partida</button></div><div id="adminEntry" class="hidden"><label>Correo del administrador</label><input id="adminEmail" type="email"><label>Contraseña</label><input id="adminPassword" type="password"><button id="adminLogin">Iniciar sesión</button></div></section><section id="host" class="panel hidden"><div class="bar"><h2>Panel del profesor</h2><button id="logout" class="secondary small">Salir</button></div><section id="setup"><h3>Crear partida</h3><p>Agrega los artículos y precios reales.</p><div id="productRows"></div><button id="addRow" class="secondary">+ Agregar artículo</button><button id="createSession">Crear partida</button></section><section id="hostGame" class="hidden"><p class="code">Código de partida: <strong id="hostCode"></strong></p><div class="product" id="hostProduct"></div><h3>Estimaciones recibidas</h3><div id="answers"></div><p id="revealPrice" class="price hidden"></p><button id="reveal">Revelar precio</button><button id="nextRound" class="hidden">Siguiente artículo</button><button id="endGame" class="secondary">Finalizar partida</button></section></section><section id="player" class="panel hidden"><p id="playerCaption"></p><h2 id="roundTitle"></h2><div id="playerProduct" class="product"></div><div id="submitArea"><label for="guess">Tu estimación (solo números)</label><input id="guess" inputmode="numeric" autocomplete="off" placeholder="Ej. 85000"><button id="sendGuess">Enviar estimación</button></div><div id="waiting" class="hidden waiting">Estimación recibida. Espera al profesor.</div><p id="playerMessage"></p></section></main><script type="module" src="src/app.js"></script></body></html>
